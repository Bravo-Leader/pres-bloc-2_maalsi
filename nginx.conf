server {
    listen 80;
    root /usr/share/nginx/html;
    index index-dynamic.html index.html;
    # Redirections relatives : le site est servi en HTTPS derrière Nginx Proxy Manager
    absolute_redirect off;

    # Présentation individuelle, aussi accessible sous /indiv/
    location = /indiv { return 301 /indiv/; }
    location /indiv/ {
        alias /usr/share/nginx/html/individuel/;
        index index.html;
    }

    # Kit oral (script complet, notes, questions, glossaire)
    location = /script { return 301 /script/; }
    location /script/ {
        alias /usr/share/nginx/html/script/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index-dynamic.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
